{% extends "core/base.html" %}
{% load static %}

{% block title %}Cambia tu contraseña | LogiVisir Solutions{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card card-login shadow-lg border-0">

        <div class="card-login-header text-center mb-2">
          <div class="logo-wrapper mb-3">
            <img src="{% static 'core/img/logivisir_logo.png' %}"
                 alt="LogiVisir Solutions"
                 class="navbar-logo">
          </div>
          <div class="brand-title">Bienvenido a LogiVisir</div>
          <div class="brand-subtitle">
            Por seguridad, crea tu propia contraseña antes de continuar.
          </div>
        </div>

        <div class="card-body p-4">

          {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
          {% endif %}

          <form method="POST" autocomplete="off">
            {% csrf_token %}

            <div class="mb-3">
              <label for="nueva_password" class="form-label">Nueva contraseña</label>
              <input type="password" class="form-control" id="nueva_password"
                     name="nueva_password" required>
            </div>

            <div class="mb-3">
              <label for="confirmar_password" class="form-label">Confirma tu contraseña</label>
              <input type="password" class="form-control" id="confirmar_password"
                     name="confirmar_password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Guardar y continuar
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
