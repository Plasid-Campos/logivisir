{% extends "core/base.html" %}

{% block title %}Nuevo producto{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Nuevo producto</h3>

    {% if mensaje %}
        <div class="alert alert-success">{{ mensaje }}</div>
    {% endif %}
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <input type="text" name="descripcion" class="form-control">
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Precio</label>
            <input type="number" step="0.01" min="0" name="precio" class="form-control" required>
          </div>
          <div class="col-md-4 mb-3">
            <label>Unidad</label>
            <input type="text" name="unidad" class="form-control" placeholder="unidad, kg, docena..." value="unidad">
          </div>
          <div class="col-md-4 mb-3">
            <label>Stock disponible</label>
            <input type="number" min="0" name="stock_disponible" class="form-control" value="0">
          </div>
        </div>

        <button class="btn btn-primary">Crear producto</button>
        <a href="{% url 'lista_productos' %}" class="btn btn-link">Volver</a>
    </form>
</div>
{% endblock %}
