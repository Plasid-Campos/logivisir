{% extends "core/base.html" %}

{% block title %}Editar Chofer{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Editar Chofer</h3>

    {% if mensaje %}
        <div class="alert alert-success">{{ mensaje }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>RUT</label>
            <input type="text" name="rut" class="form-control" value="{{ chofer.rut }}" required>
        </div>

        <div class="mb-3">
            <label>Teléfono</label>
            <input type="text" name="telefono" class="form-control" value="{{ chofer.telefono }}">
        </div>

        <div class="mb-3">
            <label>Licencia</label>
            <input type="text" name="licencia" class="form-control" value="{{ chofer.licencia }}">
        </div>

        <div class="mb-3">
            <label>Patente</label>
            <input type="text" name="patente" class="form-control" value="{{ chofer.patente }}">
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" name="activo" class="form-check-input" {% if chofer.activo %}checked{% endif %}>
            <label class="form-check-label">Activo</label>
        </div>

        <button class="btn btn-primary">Guardar Cambios</button>
        <a href="{% url 'lista_choferes' %}" class="btn btn-link">Volver</a>
    </form>
</div>
{% endblock %}
