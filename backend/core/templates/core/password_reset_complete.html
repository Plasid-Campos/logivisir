{% extends "core/base.html" %}

{% block title %}Contraseña actualizada | LogiVisir Solutions{% endblock %}

{% block content %}
<div class="password-page d-flex align-items-center justify-content-center py-5">
  <div class="container" style="max-width: 520px;">
    <div class="card shadow-lg border-0">
      <div class="card-body p-4 p-md-5 text-center">

        <div class="mb-3">
          <i class="bi bi-check-circle" style="font-size: 3rem; color:#198754;"></i>
        </div>

        <h3 class="mb-3">Contraseña actualizada</h3>
        <p class="text-muted">
          Tu contraseña ha sido restablecida correctamente.
          Ya puedes iniciar sesión con tus nuevas credenciales.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary mt-2">
          Ir al inicio de sesión
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
