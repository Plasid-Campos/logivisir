{% extends "core/base.html" %}

{% block title %}Crear Usuario | API Rutas{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="col-md-6 mx-auto">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-4">Crear Usuario del Sistema</h3>

                {% if mensaje %}
                    <div class="alert alert-success">{{ mensaje }}</div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control mb-2" name="nombre" required>

                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-control mb-2" name="apellido" required>

                    <label class="form-label">Nombre de usuario</label>
                    <input type="text" class="form-control mb-2" name="username" required>

                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control mb-2" name="password" required>

                    <label class="form-label">Rol del usuario</label>
                    <select name="rol" class="form-select mb-3" required>
                        <option value="ADMIN">Administrador</option>
                        <option value="CHOFER">Chofer</option>
                    </select>

                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" name="email"
                                placeholder="correo@empresa.cl" required>
                    </div>


                    <button class="btn btn-primary w-100">Crear Usuario</button>
                </form>

                <a href="/dashboard/" class="btn btn-link w-100 mt-3">Volver al Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
