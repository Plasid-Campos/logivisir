{% extends "core/base.html" %}

{% block title %}Editar producto{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Editar producto</h3>

    {% if mensaje %}
        <div class="alert alert-success">{{ mensaje }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <input type="text" name="descripcion" class="form-control" value="{{ producto.descripcion|default:'' }}">
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Precio</label>
            <input type="number" step="0.01" min="0" name="precio" class="form-control" value="{{ producto.precio }}" required>
          </div>
          <div class="col-md-4 mb-3">
            <label>Unidad</label>
            <input type="text" name="unidad" class="form-control" value="{{ producto.unidad }}">
          </div>
          <div class="col-md-4 mb-3">
            <label>Stock disponible</label>
            <input type="number" min="0" name="stock_disponible" class="form-control" value="{{ producto.stock_disponible }}">
          </div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" name="disponible" id="id_disponible" class="form-check-input" {% if producto.disponible %}checked{% endif %}>
            <label class="form-check-label" for="id_disponible">Disponible en el catálogo</label>
        </div>

        <button class="btn btn-primary">Guardar cambios</button>
        <a href="{% url 'lista_productos' %}" class="btn btn-link">Volver</a>
    </form>
</div>
{% endblock %}
