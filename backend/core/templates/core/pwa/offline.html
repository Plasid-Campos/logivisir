<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Sin conexión | LogiVisir</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f7fb; color: #0b1220; }
    .caja { max-width: 360px; margin: 16px; padding: 28px 24px; background: #fff; border-radius: 16px;
            box-shadow: 0 8px 24px rgba(11, 18, 32, .08); text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.3rem; margin: 12px 0 8px; }
    p { color: #4a5568; line-height: 1.5; margin: 0 0 20px; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #1a56ff; color: #fff;
             font-size: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="caja">
    <img src="{{ icono }}" alt="LogiVisir">
    <h1>Estás sin conexión</h1>
    <p>LogiVisir necesita internet para mostrar tu ruta y guardar las entregas. Cuando vuelva la señal, toca «Reintentar».</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
