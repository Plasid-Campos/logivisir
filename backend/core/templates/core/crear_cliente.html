{% extends "core/base.html" %}

{% block title %}Crear Cliente{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Crear Cliente</h3>

    {% if mensaje %}
        <div class="alert alert-success">{{ mensaje }}</div>
    {% endif %}
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>RUT</label>
            <input type="text" name="rut" class="form-control">
        </div>

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Tipo de cliente</label>
            <select name="tipo_cliente" class="form-select">
                {% for valor, texto in tipos_cliente %}
                    <option value="{{ valor }}">{{ texto }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Dirección</label>
            <input type="text" name="direccion" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Comuna</label>
            <input type="text" name="comuna" class="form-control">
        </div>

        <div class="mb-3">
            <label>Ciudad</label>
            <input type="text" name="ciudad" class="form-control">
        </div>

        <div class="mb-3">
            <label>Teléfono</label>
            <input type="text" name="telefono" class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control">
        </div>

        <button class="btn btn-primary">Crear Cliente</button>
        <a href="{% url 'lista_clientes' %}" class="btn btn-link">Volver</a>
    </form>
</div>
{% endblock %}
